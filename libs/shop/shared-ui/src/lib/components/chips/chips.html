<div class="chips-field" (focusout)="handleFieldFocusOut($event)">
  <mat-form-field appearance="outline">
    <mat-label>Favorite Fruits</mat-label>
    <mat-chip-grid #chipGrid aria-label="Enter fruits">
      @for (fruit of visibleFruits(); track fruit) {
        <mat-chip-row
          (removed)="remove(fruit)"
          [editable]="true"
          [aria-description]="'press enter to edit ' + fruit.name"
        >
          {{ fruit.name }}
          <button matChipRemove [attr.aria-label]="'remove ' + fruit.name">
            <mat-icon>cancel</mat-icon>
          </button>
        </mat-chip-row>
      }
      @if (hiddenFruitCount() > 0 && !overflowExpanded()) {
        <mat-chip-row class="chips-overflow-trigger"
                      [editable]="false" (click)="$event.stopPropagation(); expandOverflow()">
          <button type="button"
                  class="chips-overflow-button"
                  aria-expanded="false"
                  [attr.aria-label]="hiddenFruitCount() + ' fruits supplémentaires'"
                  (mousedown)="$event.preventDefault(); $event.stopPropagation()"
          >
            +{{ hiddenFruitCount() }}
          </button>
        </mat-chip-row>
      }
      @if (overflowExpanded()) {
        @for (fruit of hiddenFruits(); track fruit) {
          <mat-chip-row
            class="chips-expanded-chip"
            (removed)="remove(fruit)"
            [editable]="true"
            [aria-description]="'press enter to edit ' + fruit.name"
          >
            {{ fruit.name }}
            <button
              matChipRemove
              [attr.aria-label]="'remove ' + fruit.name"
              (mousedown)="$event.preventDefault()"
            >
              <mat-icon>cancel</mat-icon>
            </button>
          </mat-chip-row>
        }
      }
      <input
        #chipInput
        class="chips-input"
        placeholder="New fruit..."
        [matChipInputFor]="chipGrid"
        [matChipInputSeparatorKeyCodes]="separatorKeysCodes"
        [matChipInputAddOnBlur]="addOnBlur"
        (matChipInputTokenEnd)="add($event)"
      />
    </mat-chip-grid>

    @if (fruits().length > 0) {
      <button
        mat-icon-button
        matSuffix
        type="button"
        aria-label="Reset fruits"
        (click)="reset()"
      >
        <mat-icon>close</mat-icon>
      </button>
    }
  </mat-form-field>
</div>
