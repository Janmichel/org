<h2 mat-dialog-title>
  {{ title() }}
</h2>

<mat-dialog-content>
  <ng-content></ng-content>
</mat-dialog-content>

<mat-dialog-actions align="end">
  <button mat-button mat-dialog-close>
    {{ cancelLabel() }}
  </button>

  <button
    mat-flat-button
    color="primary"
    (click)="confirm.emit()">
    {{ confirmLabel() }}
  </button>
</mat-dialog-actions>
