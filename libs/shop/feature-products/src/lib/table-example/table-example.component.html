<div class="shop-page table-example-page">
  <header class="table-example-page__header">
    <h1>KIS Table with actions</h1>
    <p class="kis-text-sm">
      Same parameters as the design-system docs
      (<code>table-with-actions-example</code>) — row actions, selection, sticky
      columns.
    </p>
  </header>

  <kis-table
    data-testId="table-with-actions-example"
    [columns]="columns()"
    [rows]="data()"
    [loading]="loading()"
    [actions]="tableActions"
    [tableSelection]="tableSelection"
    [size]="'md'"
    [height]="'600px'"
    [minColumnWidth]="minColumnWidth"
    (tableChange)="onTableChange($event)"
    [stickyEndColumns]="stickyEndColumnsConfig"
    [stickyStartColumns]="stickyStartColumnsConfig"
    stickyHeader
  />
</div>
