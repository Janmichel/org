<article class="demo-page">
    <div class="demo-panel__intro">
      <p class="kis-demo-eyebrow">Overlay</p>
      <h2>Popover</h2>
      <p>
        Clic ou hover, sans backdrop, flèche vers le déclencheur.
      </p>
    </div>

    <h3 class="demo-panel__kicker">Clic</h3>
    <div class="chip-board" aria-label="Exemples popover clic">
      <button
        type="button"
        matButton="filled"
        #invitePop="orgPopover"
        [orgPopover]="inviteForm"
        orgPopoverTitle="Inviter un membre"
        orgPopoverPosition="below"
        orgPopoverColor="surface"
      >
        Ouvrir le formulaire
      </button>

      <button
        type="button"
        matButton="tonal"
        #projectPop="orgPopover"
        [orgPopover]="projectFormTpl"
        orgPopoverTitle="Nouveau projet"
        orgPopoverPosition="below"
        orgPopoverColor="surface"
      >
        Popover complexe
      </button>

      <org-chip
        #notePop="orgPopover"
        [orgPopover]="noteForm"
        orgPopoverTitle="Ajouter une note"
        orgPopoverPosition="after"
        orgPopoverColor="primary"
        color="primary"
        label="Note"
        icon="edit_note"
        [rounded]="true"
      />

      @if (inviteSent()) {
        <span class="popover-feedback">Invitation enregistrée.</span>
      }
      @if (projectSaved()) {
        <span class="popover-feedback">Projet enregistré.</span>
      }
    </div>

    <h3 class="demo-panel__kicker">Hover</h3>
    <div class="chip-board" aria-label="Exemples popover hover">
      <button
        type="button"
        matButton="tonal"
        [orgPopover]="hoverForm"
        orgPopoverTrigger="hover"
        orgPopoverTitle="Édition rapide"
        orgPopoverPosition="below"
        orgPopoverColor="surface"
      >
        Survole pour éditer
      </button>
      <org-chip
        [orgPopover]="hoverForm"
        orgPopoverTrigger="hover"
        orgPopoverTitle="Édition rapide"
        orgPopoverPosition="after"
        orgPopoverColor="secondary"
        color="secondary"
        label="Hover"
        icon="touch_app"
        [bordered]="true"
      />
    </div>

    <ng-template #inviteForm>
      <form
        class="popover-form"
        (ngSubmit)="submitInvite(invitePop)"
      >
        <label class="popover-form__field">
          <span>Email</span>
          <input
            type="email"
            name="email"
            required
            autocomplete="email"
            [ngModel]="inviteEmail()"
            (ngModelChange)="inviteEmail.set($event)"
            placeholder="alex@studio.com"
          />
        </label>
        <label class="popover-form__field">
          <span>Rôle</span>
          <select
            name="role"
            [ngModel]="inviteRole()"
            (ngModelChange)="inviteRole.set($event)"
          >
            <option value="viewer">Lecteur</option>
            <option value="editor">Éditeur</option>
            <option value="admin">Admin</option>
          </select>
        </label>
        <div class="popover-form__actions">
          <button type="button" matButton (click)="invitePop.hide()">
            Annuler
          </button>
          <button type="submit" matButton="filled">Envoyer</button>
        </div>
      </form>
    </ng-template>

    <ng-template #projectFormTpl>
      <form
        class="popover-form popover-form--complex"
        (ngSubmit)="submitProject(projectPop)"
      >
        <section class="popover-form__section">
          <h4 class="popover-form__section-title">Projet</h4>
          <label class="popover-form__field">
            <span>Nom du projet</span>
            <input
              type="text"
              name="projectName"
              required
              [ngModel]="projectForm.name()"
              (ngModelChange)="projectForm.name.set($event)"
            />
          </label>
          <div class="popover-form__row">
            <label class="popover-form__field">
              <span>Client</span>
              <input
                type="text"
                name="client"
                [ngModel]="projectForm.client()"
                (ngModelChange)="projectForm.client.set($event)"
              />
            </label>
            <label class="popover-form__field">
              <span>Équipe</span>
              <select
                name="team"
                [ngModel]="projectForm.team()"
                (ngModelChange)="projectForm.team.set($event)"
              >
                <option value="product">Product</option>
                <option value="design">Design</option>
                <option value="eng">Engineering</option>
                <option value="ops">Ops</option>
              </select>
            </label>
          </div>
          <label class="popover-form__field">
            <span>Description</span>
            <textarea
              name="description"
              rows="3"
              [ngModel]="projectForm.description()"
              (ngModelChange)="projectForm.description.set($event)"
            ></textarea>
          </label>
        </section>

        <section class="popover-form__section">
          <h4 class="popover-form__section-title">Contact</h4>
          <label class="popover-form__field">
            <span>Owner</span>
            <input
              type="text"
              name="owner"
              [ngModel]="projectForm.owner()"
              (ngModelChange)="projectForm.owner.set($event)"
            />
          </label>
          <div class="popover-form__row">
            <label class="popover-form__field">
              <span>Email</span>
              <input
                type="email"
                name="ownerEmail"
                [ngModel]="projectForm.email()"
                (ngModelChange)="projectForm.email.set($event)"
              />
            </label>
            <label class="popover-form__field">
              <span>Téléphone</span>
              <input
                type="tel"
                name="phone"
                [ngModel]="projectForm.phone()"
                (ngModelChange)="projectForm.phone.set($event)"
              />
            </label>
          </div>
        </section>

        <section class="popover-form__section">
          <h4 class="popover-form__section-title">Planning & budget</h4>
          <div class="popover-form__row">
            <label class="popover-form__field">
              <span>Début</span>
              <input
                type="date"
                name="startDate"
                [ngModel]="projectForm.startDate()"
                (ngModelChange)="projectForm.startDate.set($event)"
              />
            </label>
            <label class="popover-form__field">
              <span>Fin</span>
              <input
                type="date"
                name="endDate"
                [ngModel]="projectForm.endDate()"
                (ngModelChange)="projectForm.endDate.set($event)"
              />
            </label>
          </div>
          <div class="popover-form__row">
            <label class="popover-form__field">
              <span>Priorité</span>
              <select
                name="priority"
                [ngModel]="projectForm.priority()"
                (ngModelChange)="projectForm.priority.set($event)"
              >
                <option value="low">Basse</option>
                <option value="medium">Moyenne</option>
                <option value="high">Haute</option>
                <option value="critical">Critique</option>
              </select>
            </label>
            <label class="popover-form__field">
              <span>Budget (€)</span>
              <input
                type="number"
                name="budget"
                min="0"
                step="500"
                [ngModel]="projectForm.budget()"
                (ngModelChange)="projectForm.budget.set($event)"
              />
            </label>
          </div>
        </section>

        <section class="popover-form__section">
          <h4 class="popover-form__section-title">Notifications</h4>
          <label class="popover-form__check">
            <input
              type="checkbox"
              name="notifyEmail"
              [ngModel]="projectForm.notifyEmail()"
              (ngModelChange)="projectForm.notifyEmail.set($event)"
            />
            <span>Email de suivi</span>
          </label>
          <label class="popover-form__check">
            <input
              type="checkbox"
              name="notifySlack"
              [ngModel]="projectForm.notifySlack()"
              (ngModelChange)="projectForm.notifySlack.set($event)"
            />
            <span>Alertes Slack</span>
          </label>
          <label class="popover-form__check">
            <input
              type="checkbox"
              name="notifyDigest"
              [ngModel]="projectForm.notifyDigest()"
              (ngModelChange)="projectForm.notifyDigest.set($event)"
            />
            <span>Digest hebdomadaire</span>
          </label>
          <label class="popover-form__check">
            <input
              type="checkbox"
              name="publicLink"
              [ngModel]="projectForm.publicLink()"
              (ngModelChange)="projectForm.publicLink.set($event)"
            />
            <span>Lien public en lecture seule</span>
          </label>
        </section>

        <section class="popover-form__section">
          <h4 class="popover-form__section-title">Notes internes</h4>
          <label class="popover-form__field">
            <span>Commentaires</span>
            <textarea
              name="notes"
              rows="4"
              placeholder="Risques, dépendances, décisions…"
              [ngModel]="projectForm.notes()"
              (ngModelChange)="projectForm.notes.set($event)"
            ></textarea>
          </label>
        </section>

        <div class="popover-form__actions popover-form__actions--sticky">
          <button type="button" matButton (click)="projectPop.hide()">
            Annuler
          </button>
          <button type="submit" matButton="filled">Créer le projet</button>
        </div>
      </form>
    </ng-template>

    <ng-template #noteForm>
      <form class="popover-form" (ngSubmit)="notePop.hide()">
        <label class="popover-form__field">
          <span>Message</span>
          <textarea
            name="note"
            rows="3"
            placeholder="Une note rapide…"
          ></textarea>
        </label>
        <div class="popover-form__actions">
          <button type="submit" matButton="filled">Enregistrer</button>
        </div>
      </form>
    </ng-template>

    <ng-template #hoverForm>
      <form class="popover-form" (ngSubmit)="$event.preventDefault()">
        <label class="popover-form__field">
          <span>Statut</span>
          <select name="status">
            <option value="draft">Brouillon</option>
            <option value="review">Revue</option>
            <option value="done">Terminé</option>
          </select>
        </label>
        <label class="popover-form__field">
          <span>Commentaire</span>
          <input type="text" name="comment" placeholder="Optionnel" />
        </label>
      </form>
    </ng-template>
  </article>
