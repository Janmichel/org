<div class="kis-demo-frame">
  <aside class="kis-demo-rail" aria-label="Navigation vitrine">
    <p class="kis-demo-rail__brand">org</p>

    <nav class="kis-demo-rail__nav" aria-label="Composants">
      @for (item of primaryItems; track item.fragment) {
        <a
          class="kis-demo-rail__link"
          routerLink="/demo"
          [fragment]="item.fragment"
          [class.is-active]="current().fragment === item.fragment"
          [attr.aria-current]="current().fragment === item.fragment ? 'page' : null"
          [attr.data-testId]="'nav-' + item.label.toLowerCase()"
        >
          <mat-icon class="kis-demo-rail__icon" aria-hidden="true">
            {{ item.icon }}
          </mat-icon>
          <span>{{ item.label }}</span>
        </a>
      }
    </nav>

    <nav class="kis-demo-rail__nav kis-demo-rail__nav--secondary" aria-label="Autres composants">
      @for (item of secondaryItems; track item.fragment) {
        <a
          class="kis-demo-rail__link"
          routerLink="/demo"
          [fragment]="item.fragment"
          [class.is-active]="current().fragment === item.fragment"
          [attr.aria-current]="current().fragment === item.fragment ? 'page' : null"
          [attr.data-testId]="'nav-' + item.label.toLowerCase()"
        >
          <span
            class="kis-demo-rail__dot"
            [class.is-accent]="item.accent"
            aria-hidden="true"
          ></span>
          <span>{{ item.label }}</span>
        </a>
      }
    </nav>

    <div class="kis-demo-rail__footer" aria-hidden="true">
      <span class="kis-demo-rail__dot"></span>
      <span class="kis-demo-rail__dot"></span>
      <span class="kis-demo-rail__dot"></span>
    </div>
  </aside>

  <div class="kis-demo-main">
    <header class="kis-demo-header">
      <p class="kis-demo-eyebrow">Design system</p>
      <h1 id="org-demo-title">{{ current().title }}</h1>
      <p class="kis-demo-subtitle">{{ current().subtitle }}</p>
    </header>

    <app-showcase-page />
  </div>
</div>
