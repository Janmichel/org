<!doctype html>
<html lang="fr">
  <head>
    <meta charset="utf-8" />
    <title>org-card-gallery — web component</title>
    <base href="/" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700&display=swap"
      rel="stylesheet"
    />
    <link
      href="https://fonts.googleapis.com/icon?family=Material+Icons"
      rel="stylesheet"
    />
    <style>
      body {
        margin: 0;
        padding: 1.5rem;
        background: #e8e4f0;
        font-family: Georgia, 'Times New Roman', serif;
        color: #222;
      }

      h1 {
        margin: 0 0 0.5rem;
        font-size: 1.5rem;
      }

      p {
        margin: 0 0 1.25rem;
        max-width: 40rem;
      }

      org-card-gallery {
        display: block;
      }
    </style>
  </head>
  <body>
    <h1>Hôte externe</h1>
    <p>
      Page minimale qui charge le web component
      <code>org-card-gallery</code> (Shadow DOM + Material).
    </p>

    <org-card-gallery
      id="gallery"
      columns="3"
      aria-label="Galerie d’articles"
    ></org-card-gallery>

    <script>
      const items = [
        {
          id: '1',
          variant: 'article',
          imageSrc:
            'https://images.unsplash.com/photo-1579546929518-9e396f3cc809?auto=format&fit=crop&w=800&q=80',
          imageAlt: 'Dégradé abstrait coloré',
          label: 'Label',
          title: 'Best tools used in UX/UI Designers',
          description:
            'This is the result of our ongoing efforts to improve the usability',
          author: {
            name: 'Olivia',
            avatarSrc: 'https://i.pravatar.cc/80?img=47',
            avatarAlt: 'Olivia'
          },
          meta: '3 min read'
        },
        {
          id: '2',
          variant: 'cta',
          imageSrc:
            'https://images.unsplash.com/photo-1618005198919-d3d4b5a92ead?auto=format&fit=crop&w=800&q=80',
          imageAlt: 'Composition abstraite colorée',
          title: 'Design systems that scale',
          description:
            'This is the result of our ongoing efforts to improve the usability',
          actionLabel: 'Découvrir'
        },
        {
          id: '3',
          variant: 'article',
          imageSrc:
            'https://images.unsplash.com/photo-1618005182384-a83a8bd57fbe?auto=format&fit=crop&w=800&q=80',
          imageAlt: 'Vague abstraite',
          label: 'Insight',
          title: 'Motion et profondeur',
          description: 'Une carte pour les listes éditoriales.',
          author: {
            name: 'Alex',
            avatarSrc: 'https://i.pravatar.cc/80?img=12'
          },
          meta: '5 min read'
        }
      ];

      customElements.whenDefined('org-card-gallery').then(() => {
        const gallery = document.getElementById('gallery');
        gallery.items = items;
        gallery.addEventListener('item-action', (event) => {
          console.warn('item-action', event.detail);
        });
        gallery.addEventListener('item-play', (event) => {
          console.warn('item-play', event.detail);
        });
      });
    </script>
  </body>
</html>
