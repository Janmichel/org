<!doctype html>
<html lang="fr">
  <head>
    <meta charset="utf-8" />
    <title>org-card-gallery — web component</title>
    <base href="/" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700&display=swap"
      rel="stylesheet"
    />
    <link
      href="https://fonts.googleapis.com/icon?family=Material+Icons"
      rel="stylesheet"
    />
    <link
      href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,400,0,0&display=swap"
      rel="stylesheet"
    />
    <style>
      body {
        margin: 0;
        padding: 1.5rem;
        background: #e8e4f0;
        font-family: Georgia, 'Times New Roman', serif;
        color: #222;
      }

      h1 {
        margin: 0 0 0.5rem;
        font-size: 1.5rem;
      }

      p {
        margin: 0 0 1.25rem;
        max-width: 40rem;
      }

      org-card-gallery {
        display: block;
      }
    </style>
  </head>
  <body>
    <h1>Hôte externe</h1>
    <p>
      Page minimale qui charge le web component
      <code>org-card-gallery</code> (Shadow DOM + Material) — grille
      responsive jusqu’à 8 colonnes.
    </p>

    <org-card-gallery
      id="gallery"
      columns="8"
      aria-label="Galerie d’articles"
    ></org-card-gallery>

    <script>
      const images = [
        'https://images.unsplash.com/photo-1579546929518-9e396f3cc809?auto=format&fit=crop&w=600&q=80',
        'https://images.unsplash.com/photo-1618005198919-d3d4b5a92ead?auto=format&fit=crop&w=600&q=80',
        'https://images.unsplash.com/photo-1618005182384-a83a8bd57fbe?auto=format&fit=crop&w=600&q=80',
        'https://images.unsplash.com/photo-1550684848-fac1c5b4e853?auto=format&fit=crop&w=600&q=80',
        'https://images.unsplash.com/photo-1558591710-4b4a1ae0f04d?auto=format&fit=crop&w=600&q=80',
        'https://images.unsplash.com/photo-1574169208507-84376144848b?auto=format&fit=crop&w=600&q=80',
        'https://images.unsplash.com/photo-1557672172-298e090bd0f1?auto=format&fit=crop&w=600&q=80',
        'https://images.unsplash.com/photo-1541701494587-cb58502866ab?auto=format&fit=crop&w=600&q=80'
      ];
      const titles = [
        'Best tools used in UX/UI Designers',
        'Design systems that scale',
        'Motion',
        'Galerie embarquable Shadow DOM',
        'Tokens Material',
        'Accessibilité WCAG AA',
        'Overlays',
        'Grille JSON responsive'
      ];
      const descriptions = [
        undefined,
        'Court.',
        'Carte avec un texte un peu plus long pour varier la hauteur.',
        'This is the result of our ongoing efforts to improve the usability and customizability of these components across products.',
        'Une description moyenne pour rythmer la galerie masonry.'
      ];
      const ratios = ['wide', 'landscape', 'square', 'portrait', 'tall'];
      const authors = ['Olivia', 'Alex', 'Sam', 'Maya', 'Leo', 'Nina'];

      const items = Array.from({ length: 32 }, (_, index) => {
        const isCta = index % 3 === 1;
        const authorName = authors[index % authors.length];
        return {
          id: String(index + 1),
          variant: isCta ? 'cta' : 'article',
          imageSrc: images[index % images.length],
          imageAlt: 'Visuel abstrait ' + (index + 1),
          imageRatio: ratios[index % ratios.length],
          title: titles[index % titles.length] + ' #' + (index + 1),
          description: descriptions[index % descriptions.length],
          label: isCta ? undefined : 'Label',
          meta: isCta ? undefined : (index % 7) + 2 + ' min read',
          actionLabel: isCta ? 'Découvrir' : undefined,
          author: isCta
            ? null
            : {
                name: authorName,
                avatarSrc: 'https://i.pravatar.cc/80?img=' + ((index % 60) + 1),
                avatarAlt: authorName
              }
        };
      });

      customElements.whenDefined('org-card-gallery').then(() => {
        const gallery = document.getElementById('gallery');
        gallery.items = items;
        gallery.addEventListener('item-action', (event) => {
          console.warn('item-action', event.detail);
        });
        gallery.addEventListener('item-play', (event) => {
          console.warn('item-play', event.detail);
        });
        gallery.addEventListener('item-open', (event) => {
          console.warn('item-open', event.detail);
        });
      });
    </script>
  </body>
</html>
